<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard de Controle de Tutoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">J</div>
          <div>
            <p class="eyebrow">Controle</p>
            <h1>Eng. Jackson</h1>
          </div>
        </div>

        <nav class="menu">
          <a class="active" href="#">Dashboard</a>
          <a href="#tabela">Tabela</a>
          <a href="#graficos">Gráficos</a>
        </nav>

        <div class="sidebar-card">
          <p class="label">Arquivo</p>
          <strong id="arquivoNome">Carregando planilha...</strong>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Painel de acompanhamento</p>
            <h2>Controle de Tutoria</h2>
          </div>
          <button id="recarregarBtn" class="primary-btn">Recarregar dados</button>
        </header>

        <section class="stats-grid" id="cardsContainer"></section>

        <section class="panel" id="graficos">
          <div class="panel-head">
            <h3>Gráficos</h3>
          </div>
          <div class="charts-grid">
            <div class="chart-card large">
              <canvas id="chartStatus"></canvas>
            </div>
            <div class="chart-card">
              <canvas id="chartDistribuicao"></canvas>
            </div>
            <div class="chart-card large">
              <canvas id="chartTimeline"></canvas>
            </div>
          </div>
        </section>

        <section class="panel" id="tabela">
          <div class="panel-head">
            <h3>Dados da planilha</h3>
          </div>
          <div class="table-wrap">
            <table>
              <thead id="theadTable"></thead>
              <tbody id="tbodyTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
